###############################################################################
# Nagios Monitoring Configuration for Automated DevOps Web Server
# Monitors: Host alive (PING), HTTP service availability on Port 80
###############################################################################

define command {
    command_name    check_nginx_http
    command_line    /usr/lib/nagios/plugins/check_http -H '$HOSTADDRESS$' -I '$HOSTADDRESS$' -p 80 -u / -e "HTTP/1.1 200 OK"
}

define host {
    use                     linux-server
    host_name               devops-web-server
    alias                   Automated Nginx Web Server Target
    address                 127.0.0.1
    max_check_attempts      3
    check_period            24x7
    notification_interval   60
    notification_period     24x7
}

define service {
    use                     generic-service
    host_name               devops-web-server
    service_description     HTTP Web Server Availability
    check_command           check_nginx_http
    check_interval          1
    retry_interval          1
    max_check_attempts      2
    check_period            24x7
    notification_interval   30
    notification_period     24x7
}
